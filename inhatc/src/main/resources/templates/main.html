<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script type="text/javascript">
      // =====================================================
      // 12-23 WebSocket 연결 및 알림 수신 (실시간 알림 기능)
      // =====================================================
      let stompClient = null;
      let currentUserEmail = null;
      let currentPostId = null;
      let currentModalPost = null;
      
      function connectWebSocket(email) {
        if (!email) {
          console.warn("이메일이 없어 WebSocket 연결을 건너뜁니다.");
          return;
        }
        
        currentUserEmail = email;
        const socket = new SockJS('/sns/ws');
        stompClient = Stomp.over(socket);
        
        stompClient.connect({}, function(frame) {
          console.log('WebSocket 연결됨: ' + frame);
          
          // 이메일을 URL-safe하게 변환
          const emailPath = email.replace('@', '_').replace(/\./g, '_');
          
          // 12-23 알림 수 구독
          stompClient.subscribe('/topic/notifications/count/' + emailPath, function(message) {
            const count = parseInt(JSON.parse(message.body));
            updateNotificationBadge(count);
          });
          
          // 12-23 알림 상세 정보 구독 (선택적, 필요시 사용)
          stompClient.subscribe('/topic/notifications/' + emailPath, function(message) {
            const notification = JSON.parse(message.body);
            console.log('새 알림 수신:', notification);
            if (typeof loadMainNotifications === 'function') {
              loadMainNotifications();
            }
          });
          
          // 12-23 초기 알림 수 조회
          fetchNotificationCount();
        }, function(error) {
          console.error('WebSocket 연결 오류:', error);
          // 재연결 시도 (5초 후)
          setTimeout(function() {
            if (currentUserEmail) {
              connectWebSocket(currentUserEmail);
            }
          }, 5000);
        });
      }
      
      function disconnectWebSocket() {
        if (stompClient !== null) {
          stompClient.disconnect();
          console.log('WebSocket 연결 종료');
        }
      }
      
      // 페이지를 떠날 때 WebSocket 연결 종료
      window.addEventListener('beforeunload', function() {
        disconnectWebSocket();
      });
      
      // 12-23 알림 배지 업데이트 함수
      function updateNotificationBadge(count) {
        const badge = document.getElementById('notificationBadge');
        if (badge) {
          if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count.toString();
            badge.classList.add('show');
          } else {
            badge.classList.remove('show');
          }
        }
      }
      
      // 12-23 알림 수 조회 함수
      async function fetchNotificationCount() {
        try {
          const response = await fetch('/api/notifications/count', {
            credentials: 'include'
          });
          if (response.ok) {
            const data = await response.json();
            updateNotificationBadge(data.count || 0);
          }
        } catch (error) {
          console.error('알림 수 조회 실패:', error);
        }
      }
      
      // 게시물 작성 폼 포커스 시 로그인 체크
      document.addEventListener('DOMContentLoaded', function() {
        const storedEmail = sessionStorage.getItem("loginEmail");
        if (storedEmail) updateComposeAvatar(storedEmail);

        const contentTextarea = document.getElementById('composeContent') || document.getElementById('content');
        if (contentTextarea) {
          contentTextarea.addEventListener('focus', async function() {
            const isLoggedIn = await checkLoginStatus();
            if (!isLoggedIn) {
              this.blur();
              openLoginModal();
            }
          });
        }
      });

      // =====================================================
      // 초기 실행
      // =====================================================
      window.onload = async function () {
        console.log("[window.onload] 페이지 로드 시작");

        try {
          console.log("세션 이메일 정보 요청 중...");
          await fetchMemberEmail(); // 세션 정보 가져오기 (내부에서 WebSocket 연결됨)

          console.log("게시물 목록 불러오기 시작...");
          await fetchPosts(); // 게시물 로드
          if (typeof loadMainNotifications === 'function') {
            await loadMainNotifications();
          }

          // console.log("💬 메시지 로드 시작...");
          // loadReceivedMessages(); // 메시지 로드

          // 초기 상태 설정 (요소가 존재하는 경우에만)
          const chatBox = document.getElementById("chat-box");
          const userBox = document.getElementById("user-box");
          if (chatBox) {
            chatBox.style.display = "none";
            console.log("chat-box 초기 숨김 완료");
          }
          if (userBox) {
            userBox.style.display = "none";
            console.log("user-box 초기 숨김 완료");
          }
          
          // URL 파라미터에서 postId 확인 (알림에서 클릭한 경우)
          const urlParams = new URLSearchParams(window.location.search);
          const postId = urlParams.get('postId');
          if (postId) {
            console.log("알림에서 게시물 클릭됨, postId:", postId);
            await viewPost(postId);
          }
        } catch (error) {
          console.error(" window.onload 중 에러 발생:", error);
        }

        console.log("[window.onload] 초기화 완료");
      };

      // =====================================================
      //  UI 토글 이벤트 (요소가 존재하는 경우에만)
      // =====================================================
      const toggleChat = document.getElementById("toggle-chat");
      if (toggleChat) {
        toggleChat.addEventListener("click", function () {
          console.log(" [UI] 채팅창 토글 클릭됨");
          toggleVisibility("chat-box");
        });
      }

      const toggleUser = document.getElementById("toggle-user");
      if (toggleUser) {
        toggleUser.addEventListener("click", function () {
          console.log(" [UI] 사용자 목록 토글 클릭됨");
          toggleVisibility("user-box");
        });
      }

      function toggleVisibility(id) {
        const element = document.getElementById(id);
        if (!element) {
          console.error(`[toggleVisibility] 요소를 찾을 수 없습니다: ${id}`);
          return;
        }

        const prevDisplay = element.style.display;
        element.style.display =
          prevDisplay === "none" || prevDisplay === "" ? "flex" : "none";

        console.log(
          `[toggleVisibility] ${id}: ${prevDisplay} → ${element.style.display}`
        );
      }

      // =====================================================
      // 🔹 세션 / 사용자 관련
      // =====================================================
      async function fetchMemberEmail() {
        console.log("[fetchMemberEmail] 호출됨");

        try {
          const response = await fetch("/api/members/session", { credentials: "include" });
          console.log("[fetchMemberEmail] 응답 상태 코드:", response.status);

          if (response.status === 401) {
            alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
            window.location.href = "/";
            return;
          }

          const data = await response.json();
          console.log("[fetchMemberEmail] 응답 데이터:", data);

          if (data.loginEmail) {
            console.log("로그인 이메일 확인됨:", data.loginEmail);
            saveMemberEmail(data.loginEmail);
          } else {
            console.warn(
              "[fetchMemberEmail] 사용자 이메일을 찾을 수 없습니다. 로그인 페이지로 이동합니다."
            );
            window.location.href = "/";
          }
        } catch (error) {
          console.error("[fetchMemberEmail] 에러 발생:", error);
          window.location.href = "/";
        }
      }

      function updateComposeAvatar(email) {
        const avatar = document.getElementById("composeAvatar");
        if (!avatar || !email) return;
        avatar.src = "/member/Userimgsource/" + encodeURIComponent(email);
        avatar.style.visibility = "visible";
        avatar.onerror = function () {
          this.src = "/images/default-profile.png";
          this.style.visibility = "visible";
        };
      }

      function saveMemberEmail(memberEmail) {
        console.log(
          "💾 [saveMemberEmail] sessionStorage에 저장 시도:",
          memberEmail
        );
        sessionStorage.setItem("loginEmail", memberEmail);
        currentUserEmail = memberEmail; // 전역 변수에도 설정
        updateComposeAvatar(memberEmail);
        console.log("[saveMemberEmail] 저장 완료");
        
        // WebSocket 연결 (아직 연결되지 않은 경우)
        if (stompClient === null || !stompClient.connected) {
          connectWebSocket(memberEmail);
        }
      }
      /***
       * 로그인된 사용자 이메일 가져오기 (sessionStorage / currentUserEmail 캐시)
       */
      async function getMemberEmail(forceRefresh = false) {
        if (!forceRefresh) {
          if (currentUserEmail) return currentUserEmail;
          const stored = sessionStorage.getItem("loginEmail");
          if (stored) {
            currentUserEmail = stored;
            return stored;
          }
        }

        try {
          const response = await fetch("/api/members/session", {
            credentials: "include",
          });

          if (!response.ok) {
            throw new Error("세션 정보를 가져오는데 실패했습니다.");
          }

          const data = await response.json();
          if (data.loginEmail) {
            currentUserEmail = data.loginEmail;
            sessionStorage.setItem("loginEmail", data.loginEmail);
          }
          return data.loginEmail || null;
        } catch (error) {
          console.error("Error fetching session info:", error);
          return null;
        }
      }

      async function fetchFollowStatusBatch(emails) {
        if (!emails || emails.length === 0) return {};
        try {
          const response = await fetch("/api/members/me/following/status/batch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ emails }),
          });
          if (!response.ok) return {};
          return await response.json();
        } catch (error) {
          console.error("팔로우 상태 일괄 조회 중 오류:", error);
          return {};
        }
      }

      function buildPostCard(post, memberEmail, followStatusMap) {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("data-id", post.id);
        card.onclick = function () {
          viewPost(post.id);
        };

        if (memberEmail && post.writerEmail === memberEmail) {
          const closeButton = document.createElement("span");
          closeButton.className = "close-button";
          closeButton.innerHTML = "&times;";
          closeButton.onclick = function (event) {
            event.stopPropagation();
            deletePost(event, this.parentNode.getAttribute("data-id"));
          };
          card.appendChild(closeButton);
        }

        const img = document.createElement("img");
        img.className = "profile-img";
        img.src = post.profilePicturePath;
        img.onerror = function () {
          this.src = "/images/default-profile.png";
        };

        const cardContent = document.createElement("div");
        cardContent.className = "card-content";

        const header = document.createElement("div");
        header.className = "card-header";
        const authorLink = document.createElement("a");
        authorLink.href = `/member/profile/${encodeURIComponent(post.writerEmail)}`;
        authorLink.onclick = function(e) {
          e.stopPropagation();
        };
        authorLink.textContent = post.writerName || "(이름 없음)";
        header.appendChild(authorLink);

        if (memberEmail && post.writerEmail !== memberEmail) {
          const followButton = document.createElement("button");
          followButton.className = "follow-btn";
          followButton.setAttribute("data-writer-email", post.writerEmail);
          followButton.onclick = function(e) {
            e.stopPropagation();
            toggleFollow(post.writerEmail, followButton);
          };
          updateFollowButton(followButton, followStatusMap[post.writerEmail] === true);
          header.appendChild(followButton);
        }

        const dateDiv = document.createElement("div");
        dateDiv.className = "card-date";
        dateDiv.textContent = new Date(post.createdDate).toLocaleString("ko-KR", {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

        const body = document.createElement("div");
        body.className = "card-body";
        body.textContent = post.content || "(내용 없음)";

        if (post.imgsource) {
          const contentImg = document.createElement("img");
          contentImg.className = "content-img";
          contentImg.src = post.imgsource;
          contentImg.onerror = function () {
            this.style.display = "none";
          };
          body.appendChild(contentImg);
        }

        cardContent.appendChild(header);
        cardContent.appendChild(dateDiv);
        cardContent.appendChild(body);
        card.appendChild(img);
        card.appendChild(cardContent);
        return card;
      }

      function prependPost(post, memberEmail) {
        const postContainer = document.getElementById("postContainer");
        if (!postContainer) return;

        const placeholder = postContainer.querySelector("div:not(.card)");
        if (placeholder) {
          postContainer.innerHTML = "";
        }

        postContainer.insertBefore(buildPostCard(post, memberEmail, {}), postContainer.firstChild);
      }

      // =====================================================
      // 🔹 게시물 관련
      // =====================================================
      async function fetchPosts() {
        console.log("[fetchPosts] 함수 실행됨");

        try {
          const memberEmail = await getMemberEmail();

          let url = "/api/posts";
          if (currentTab === "following") {
            if (memberEmail) {
              url = `/api/posts/following?email=${encodeURIComponent(memberEmail)}`;
            }
          }

          const response = await fetch(url);
          if (!response.ok) {
            console.error("응답 실패:", response.statusText);
            return;
          }

          const responseData = await response.json();
          const posts = Array.isArray(responseData) ? responseData : (responseData.content || []);

          const postContainer = document.getElementById("postContainer");
          if (!postContainer) {
            console.error("postContainer 요소를 찾을 수 없습니다!");
            return;
          }

          postContainer.innerHTML = "";

          if (!Array.isArray(posts) || posts.length === 0) {
            const emptyMessage = currentTab === "following"
              ? "팔로잉 중인 사용자의 게시물이 없습니다."
              : "게시물이 없습니다.";
            postContainer.innerHTML = `<div style='padding: 20px; text-align: center; color: #536471;'>${emptyMessage}</div>`;
            return;
          }

          const writerEmails = [...new Set(
            posts
              .filter((post) => post.writerEmail && post.writerEmail !== memberEmail)
              .map((post) => post.writerEmail)
          )];
          const followStatusMap = await fetchFollowStatusBatch(writerEmails);

          posts.forEach((post) => {
            postContainer.appendChild(buildPostCard(post, memberEmail, followStatusMap));
          });
        } catch (error) {
          console.error("게시물 가져오기 중 에러 발생:", error);
        }
      }

      async function loadPostInModal(postId) {
        const detail = document.getElementById("postDetail");
        if (!detail) return;
        try {
          const response = await fetch(`/api/posts/${encodeURIComponent(postId)}`, {

        const isOwner = memberEmail && post.writerEmail === memberEmail;
        const dateStr = new Date(post.createdDate).toLocaleString(

        );

        detail.innerHTML =
          '<article class="post-modal-article">' +
          '<div class="post-modal-author-row">' +
          '<img class="profile-img" src="' + (post.profilePicturePath || "/images/default-profile.png") + '" onerror="this.src=\'/images/default-profile.png\'" alt="" />' +
          '<div class="post-modal-author-meta">' +
          '<a class="post-modal-author" href="/member/profile/' + encodeURIComponent(post.writerEmail || "") + '">' +
          (post.writerName || "(이름 없음)") +
          "</a>" +
          '<div class="post-modal-date">' + dateStr + "</div>" +
          "</div>" +
          "</div>" +
          '<div class="post-modal-content">' + (post.content || "").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>") + "</div>" +

      // 로그인 처리
      async function handleLogin(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const errorDiv = document.getElementById("loginError");

        try {
          const response = await fetch("/api/members/login", {

            credentials: "include"
          });

          if (response.ok) {

      async function savePost(event) {
        event.preventDefault();

        const composeEl = document.getElementById("composeContent");
        const legacyEl = document.getElementById("content");
        const content = composeEl ? composeEl.value : (legacyEl ? legacyEl.value : "");
        if (legacyEl && composeEl) legacyEl.value = content;

        const fileInput = document.getElementById("fileUpload");
        const file = fileInput.files[0];

        // 로그인 상태 확인
        const isLoggedIn = await checkLoginStatus();
        if (!isLoggedIn) {
          openLoginModal();
          return;
        }

        const userEmail = await getMemberEmail();
        if (!userEmail) {
          openLoginModal();
          return;
        }

        const formData = new FormData();
        formData.append("content", content);
        formData.append("email", userEmail);
        if (file) {
          formData.append("file", file);
        }

        try {
          const response = await fetch("/api/posts", {
            method: "POST",
            body: formData,
            credentials: "include",
          });

          if (!response.ok) {
            throw new Error("게시물을 저장하는데 실패했습니다.");
          }

          const createdPost = await response.json();
          if (composeEl) composeEl.value = "";
          if (legacyEl) legacyEl.value = "";
          if (fileInput) fileInput.value = "";
          const counter = document.getElementById("composeCharCount");
          if (counter) counter.textContent = "0 / 2000";
          if (window.SocialUI && window.SocialUI.refreshComposeSend) {
            window.SocialUI.refreshComposeSend();
          }
          if (currentTab === "forYou") {
            prependPost(createdPost, userEmail);
          }
        } catch (error) {
          console.error("Error:", error);
        }
      }

      // =====================================================
      // 🔹 댓글 FETCH
      // =====================================================
      async function fetchComments(postId) {
        if (!postId) return;
        try {
          const response = await fetch(
            `/api/posts/${encodeURIComponent(postId)}/comments?all=true`,
            { credentials: "include" }
          );
          if (!response.ok) return;
          const raw = await response.json();
          const comments = Array.isArray(raw) ? raw : (raw.content || []);

          const commentsContainer = document.getElementById("comments");
          if (!commentsContainer) return;
          commentsContainer.innerHTML = "";

          if (comments.length === 0) {
            commentsContainer.innerHTML =
              '<p class="post-modal-empty-comments">' +
              (window.SnsI18n ? window.SnsI18n.t("post.comments") + " 없음" : "댓글이 없습니다.") +
              "</p>";
            return;
          }

          comments.forEach((comment) => {
            const commentDiv = document.createElement("div");
            commentDiv.className = "comment";

            // 작성자 프로필 이미지 사용
            const img = document.createElement("img");
            img.className = "profile-img";
            img.src = comment.writerProfile; // DTO에서 가져온 프로필 경로
            img.onerror = function() {
              this.src = "/images/default-profile.png";
            };
            if (comment.writer) {
              img.dataset.writerEmail = comment.writer;
              img.classList.add("profile-img-link");
              img.style.cursor = "pointer";
              img.onclick = function (e) {
                e.stopPropagation();
                window.location.href = `/member/profile/${encodeURIComponent(comment.writer)}`;
              };
            }

            const commentContent = document.createElement("div");
            commentContent.style.flex = "1";
            commentContent.innerHTML = `
                <p style="margin: 0 0 4px 0;"><strong>${comment.writerName}</strong></p>
                <p style="margin: 0; color: #0f1419;">${comment.comment}</p>
            `;

            commentDiv.appendChild(img);
            commentDiv.appendChild(commentContent);
            commentsContainer.appendChild(commentDiv);
          });
        } catch (error) {
          console.error("Error fetching comments:", error);
        }
      }
      // =====================================================
      // 댓글 작성
      // =====================================================
      //  댓글 작성 함수 (postId 인자로 받기)
      async function submitComment(postId) {
        const targetPostId = postId || currentPostId;
        if (!targetPostId) return;
        const commentContent = document.getElementById("commentContent").value;
        
        if (!commentContent || commentContent.trim() === "") {
          alert("댓글 내용을 입력해주세요.");
          return;
        }

        const userEmail = await getMemberEmail();
        if (!userEmail) {
          openLoginModal();
          return;
        }

        const data = {
          comment: commentContent.trim(),
          user: userEmail,
          article: Number(targetPostId),
        };

        try {
          console.log(" 댓글 작성 요청 postId:", targetPostId, "user:", userEmail);

          const response = await fetch(`/api/posts/${encodeURIComponent(targetPostId)}/comments`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(data),
          });

          if (!response.ok) {
            const errorText = await response.text();
            console.error("댓글 저장 실패:", errorText);
            throw new Error("댓글 저장 실패: " + errorText);
          }

          alert("댓글이 성공적으로 저장되었습니다!");
          document.getElementById("commentContent").value = "";
          fetchComments(targetPostId);
        } catch (error) {
          console.error(" Error submitting comment:", error);
          alert("댓글 저장 중 오류가 발생했습니다: " + error.message);
        }
      }

      function getPostIdFromUrl() {
        const pathParts = window.location.pathname.split("/");
        return pathParts[pathParts.length - 1];

      // =====================================================

      async function toggleLove(postId, button) {
        const user = await getMemberEmail();
        if (!user || user === "defaultEmail") {
          alert("로그인이 필요합니다.");
          return;
        }

        console.log(`[toggleLove] 호출됨 → postId=${postId}, user=${user}`);

        try {
          const response = await fetch(
            `/api/posts/${postId}/likes?email=${encodeURIComponent(user)}`,

          );

          console.log("[toggleLove] 응답 상태:", response.status);

            throw new Error(`서버 오류: ${errorText}`);
          }

          const data = await response.json();

      function scrollToMainNotifs(event) {
        if (event && event.preventDefault) event.preventDefault();
        const rail = document.getElementById('mainNotifRail');
        if (rail) {
          rail.scrollIntoView({ behavior: 'smooth', block: 'start' });
          rail.classList.add('notif-rail-highlight');
          setTimeout(function() { rail.classList.remove('notif-rail-highlight'); }, 1200);

      let mainNotifCache = [];

      async function loadMainNotifications() {
        const list = document.getElementById('mainNotifList');
        if (!list) return;
        try {
          const response = await fetch('/api/notifications/all', { credentials: 'include' });
          if (response.status === 401 || response.status === 403) {
            list.innerHTML = '<p class="notif-rail-empty">' + (window.SnsI18n ? window.SnsI18n.t('auth.loginRequired') : '로그인이 필요합니다.') + '</p>';
            return;
          }
          if (!response.ok) {
            throw new Error('load failed');
          }
          mainNotifCache = await response.json();
          mainNotifCache.sort(function(a, b) {
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
          renderMainNotifications();
          const unread = mainNotifCache.filter(function(n) { return !n.isRead; }).length;
          updateNotificationBadge(unread);
        } catch (error) {
          console.error('메인 알림 로드 실패:', error);
          list.innerHTML = '<p class="notif-rail-empty">' + (window.SnsI18n ? window.SnsI18n.t('notif.loadFailed') : '알림을 불러올 수 없습니다.') + '</p>';
        }
      }

      function renderMainNotifications() {
        const list = document.getElementById('mainNotifList');
        if (!list) return;
        const i18n = window.SnsI18n;
        const particle = i18n ? i18n.t('notif.actorParticle') : '님이';
        const locale = i18n && i18n.getLang && i18n.getLang() === 'ja' ? 'ja-JP' : 'ko-KR';

        if (!mainNotifCache || mainNotifCache.length === 0) {
          list.innerHTML = '<p class="notif-rail-empty">' + (i18n ? i18n.t('notif.empty') : '새로운 알림이 없습니다.') + '</p>';
          return;
        }

        list.innerHTML = '';
        mainNotifCache.forEach(function(notification) {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'notif-rail-item' + (notification.isRead ? ' read' : ' unread');

          const typeText = notification.notificationType === 'LIKE'
            ? (i18n ? i18n.t('notif.likeType') : '❤️ 좋아요')
            : (i18n ? i18n.t('notif.commentType') : '💬 댓글');
          const actionText = notification.notificationType === 'LIKE'
            ? (i18n ? i18n.t('notif.like') : '좋아요를 눌렀습니다')
            : (i18n ? i18n.t('notif.comment') : '댓글을 남겼습니다');
          const actorName = notification.actorName || notification.actorEmail || '';
          const date = new Date(notification.createdAt).toLocaleString(locale, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          const preview = notification.postContent
            ? notification.postContent.substring(0, 80) + (notification.postContent.length > 80 ? '…' : '')
            : '';

          item.innerHTML =
            '<span class="notif-rail-type">' + typeText + '</span>' +
            '<span class="notif-rail-action">' + actorName + particle + ' ' + actionText + '</span>' +
            (preview ? '<span class="notif-rail-preview">' + preview + '</span>' : '') +
            '<span class="notif-rail-date">' + date + '</span>';

          item.onclick = async function() {
            if (!notification.isRead && notification.id) {
              try {
                await fetch('/api/notifications/' + notification.id + '/read', {
                  method: 'POST',
                  credentials: 'include'
                });
                notification.isRead = true;
                item.classList.remove('unread');
                item.classList.add('read');
                updateNotificationBadge(mainNotifCache.filter(function(n) { return !n.isRead; }).length);
              } catch (e) {
                console.warn('알림 읽음 처리 실패', e);
              }
            }
            if (notification.postId) {
              viewPost(notification.postId);
            }
          };

          list.appendChild(item);
        });
      }

      document.addEventListener('sns:langchange', function() {

      // =====================================================

      let currentTab = 'forYou'; // 기본값: 추천

      function switchTab(tab) {
        currentTab = tab;
        
        // 탭 버튼 활성화 상태 변경
        const forYouTab = document.getElementById('forYouTab');
        const followingTab = document.getElementById('followingTab');
        
        if (tab === 'forYou') {
          forYouTab.classList.add('active');
          forYouTab.setAttribute('aria-selected', 'true');

          followingTab.setAttribute('aria-selected', 'true');
          forYouTab.classList.remove('active');
          forYouTab.setAttribute('aria-selected', 'false');
        }

      // =====================================================
      // 🔹 팔로우 기능
      // =====================================================
      // 팔로우 버튼 상태 업데이트 (텍스트 및 hover 처리)
      function updateFollowButton(button, isFollowing) {
        var label = window.SnsI18n && window.SnsI18n.followLabel
          ? window.SnsI18n.followLabel(isFollowing, false)
          : (isFollowing ? "팔로잉" : "팔로우");

        if (isFollowing) {
          button.classList.add('following');
          button.textContent = label;
          
          // hover 이벤트가 없으면 추가 (한 번만)
          if (!button.hasAttribute('data-hover-bound')) {
            button.setAttribute('data-hover-bound', 'true');
            button.addEventListener('mouseenter', function() {
              if (this.classList.contains('following')) {
                this.textContent = window.SnsI18n && window.SnsI18n.followLabel
                  ? window.SnsI18n.followLabel(true, true)
                  : '언팔로우';
              }
            });
            
            button.addEventListener('mouseleave', function() {
              if (this.classList.contains('following')) {
                this.textContent = window.SnsI18n && window.SnsI18n.followLabel
                  ? window.SnsI18n.followLabel(true, false)
                  : '팔로잉';
              }
            });
          }
        } else {
          button.classList.remove('following');
          button.textContent = label;
        }
      }

      // 팔로우/언팔로우 토글
      async function toggleFollow(writerEmail, button) {
        try {
          const memberEmail = await getMemberEmail();
          if (!memberEmail) {
            alert('로그인이 필요합니다.');
            return;
          }

          if (memberEmail === writerEmail) {
            alert('자기 자신을 팔로우할 수 없습니다.');
            return;
          }

          const isFollowing = button.classList.contains('following');
          const url = `/api/members/me/following/${encodeURIComponent(writerEmail)}`;

          const response = await fetch(url, {
            method: isFollowing ? 'DELETE' : 'POST',
            credentials: 'include'
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || '팔로우 처리 중 오류가 발생했습니다.');
          }

          // 버튼 상태 업데이트
          const newFollowingState = !isFollowing;
          updateFollowButton(button, newFollowingState);
        } catch (error) {
          console.error('팔로우 처리 중 오류:', error);
          alert(error.message || '팔로우 처리 중 오류가 발생했습니다.');
        }
      }

      // =====================================================
      // 🔹 채팅 입력 이벤트 (마지막에 배치, 요소가 존재하는 경우에만)
      // =====================================================
      const chatInput = document.getElementById("chat-input");
      if (chatInput) {
        chatInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            const sendBtn = document.getElementById("send-btn");
            if (sendBtn) {
              sendBtn.click();
            }
          }
        });
      }
    </script>
  </body>
</html>
