<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <script>(function(){try{var t=localStorage.getItem('sns-theme')||'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');var l=localStorage.getItem('sns-lang')||'ko';document.documentElement.setAttribute('lang',l==='ja'?'ja':'ko');}catch(e){}})();</script>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>알림</title>
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/social-theme.css" />
    <link rel="stylesheet" href="/css/social-pages.css" />
    <link rel="stylesheet" href="/css/templates-theme.css" />
    <link rel="stylesheet" href="/css/i18n.css" />
    <script src="/js/i18n.js" defer></script>
    <script src="/js/social-ui.js" defer></script>
  </head>
  <body class="feed-body">
    <div class="wrapper">
      <!-- 메인 컨텐츠 영역 -->
      <div class="main-content">
        <!-- REST/레이아웃 개선: sidebar를 메인 컨테이너 안에 두고 sticky로 따라오게 함 -->
        <div class="sidebar">
          <a href="/main" class="sidebar-item">
            <img src="/images/home.svg" alt="home" />
            <span data-i18n="nav.home">Home</span>
          </a>
          <a href="/member/mypage" class="sidebar-item">
            <img src="/images/user.svg" alt="User" />
            <span data-i18n="nav.user">User</span>
          </a>
          <a href="/chat/message" class="sidebar-item">
            <img src="/images/message.svg" alt="Message" />
            <span data-i18n="nav.message">Message</span>
          </a>
          <div class="sidebar-item notification-icon-container active" onclick="location.href='/posts/notifications/page';" style="cursor: pointer;">
            <img src="/images/bell.svg" alt="Alarm" id="notificationIcon" />
            <span data-i18n="nav.alarm">Alarm</span>
            <span id="notificationBadge" class="notification-badge">0</span>
          </div>
          <div class="sidebar-item" onclick="document.getElementById('logout').submit();" style="cursor: pointer;">
            <img src="/images/logout.svg" alt="Logout" />
            <span data-i18n="nav.logout">Logout</span>
          </div>
          <div class="sidebar-theme">
            <label class="theme-switch" data-i18n-attr="title" data-i18n="nav.themeDark" title="다크 모드">
              <input type="checkbox" data-theme-toggle aria-label="다크 모드">
              <span class="theme-switch-slider"></span>
              <span data-i18n="nav.theme">테마</span>
            </label>
          </div>

          <form id="logout" action="/api/members/logout" method="post"></form>
        </div>

        <!-- 알림 열: 헤더 + 목록을 한 컬럼으로 묶어 겹침 방지 -->
        <div class="notif-page-column">
          <div class="top-header notif-top-header">
            <button class="back-button" onclick="goBack()">←</button>
            <div class="header-title" data-i18n="notif.title">알림</div>
            <div id="langSwitcher" class="lang-switcher">
              <button type="button" class="lang-switcher-btn" data-lang="ko" aria-pressed="false">한국어</button>
              <button type="button" class="lang-switcher-btn" data-lang="ja" aria-pressed="false">日本語</button>
            </div>
          </div>

          <div id="notificationsContainer" class="notifications-container">
            <div class="loading" data-i18n="notif.loading">알림을 불러오는 중...</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script type="text/javascript">
      // =====================================================
      // 12-23 WebSocket 연결 및 알림 수 수신 (실시간 알림 기능)
      // =====================================================
      let stompClient = null;
      let currentUserEmail = null;
      
      function connectWebSocket(email) {
        if (!email) {
          console.warn("이메일이 없어 WebSocket 연결을 건너뜁니다.");
          return;
        }
        
        currentUserEmail = email;
        const socket = new SockJS('/sns/ws');
        stompClient = Stomp.over(socket);
        
        stompClient.connect({}, function(frame) {
          console.log('WebSocket 연결됨: ' + frame);
          
          // 이메일을 URL-safe하게 변환
          const emailPath = email.replace('@', '_').replace(/\./g, '_');
          
          // 12-23 알림 수 구독
          stompClient.subscribe('/topic/notifications/count/' + emailPath, function(message) {
            const count = parseInt(JSON.parse(message.body));
            console.log('알림 수 업데이트:', count);
            updateNotificationBadge(count);
          });
          
          // 12-23 초기 알림 수 조회
          fetchNotificationCount();
        }, function(error) {
          console.error('WebSocket 연결 오류:', error);
        });
      }
      
      function disconnectWebSocket() {
        if (stompClient !== null) {
          stompClient.disconnect();
          console.log('WebSocket 연결 종료');
        }
      }
      
      // 페이지를 떠날 때 WebSocket 연결 종료
      window.addEventListener('beforeunload', function() {
        disconnectWebSocket();
      });
      
      // 현재 사용자 이메일 가져오기
      async function getCurrentUserEmail() {
        try {
          const response = await fetch("/api/members/session", {
            credentials: "include"
          });
          if (response.ok) {
            const data = await response.json();
            return data.loginEmail;
          }
        } catch (error) {
          console.error("사용자 이메일 가져오기 실패:", error);
        }
        return null;
      }
      
      // 12-23 알림 배지 업데이트 함수
      function updateNotificationBadge(count) {
        const badge = document.getElementById('notificationBadge');
        if (badge) {
          if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count.toString();
            badge.classList.add('show');
          } else {
            badge.classList.remove('show');
          }
        }
      }
      
      // 12-23 알림 수 조회 함수
      async function fetchNotificationCount() {
        try {
          const response = await fetch('/api/notifications/count', {
            credentials: 'include'
          });
          if (response.ok) {
            const data = await response.json();
            updateNotificationBadge(data.count || 0);
          }
        } catch (error) {
          console.error('알림 수 조회 실패:', error);
        }
      }

      // 페이지 로드 시 알림 정보 가져오기
      window.onload = async function () {
        const email = await getCurrentUserEmail();
        if (email) {
          connectWebSocket(email);
        }
        await loadNotifications();
      };

      // 뒤로 가기
      function goBack() {
        window.history.back();
      }

      // 12-23 알림 로드 함수
      async function loadNotifications() {
        const container = document.getElementById("notificationsContainer");
        
        try {
          const response = await fetch("/posts/notifications/all", {
            credentials: "include"
          });
          
          if (!response.ok) {
            if (response.status === 401) {
              container.innerHTML = "<div class='error'>" + (window.SnsI18n ? window.SnsI18n.t("auth.loginRequired") : "로그인이 필요합니다.") + "</div>";
              setTimeout(() => {
                window.location.href = "/";
              }, 2000);
              return;
            }
            throw new Error("알림을 불러올 수 없습니다.");
          }

          const notifications = await response.json();
          renderNotifications(notifications);
          
          // 12-23 읽지 않은 알림 수 업데이트
          const unreadCount = notifications.filter(n => !n.isRead).length;
          updateNotificationBadge(unreadCount);
        } catch (error) {
          console.error("알림 로드 오류:", error);
          container.innerHTML = "<div class='error'>" + (window.SnsI18n ? window.SnsI18n.t("notif.loadFailed") : "알림을 불러올 수 없습니다.") + "</div>";
        }
      }

      // 12-23 알림 렌더링 함수
      let cachedNotifications = [];
      let notificationsLoaded = false;

      function renderNotifications(notifications) {
        cachedNotifications = notifications || [];
        notificationsLoaded = true;
        const container = document.getElementById("notificationsContainer");
        const i18n = window.SnsI18n;
        
        if (!cachedNotifications || cachedNotifications.length === 0) {
          container.innerHTML = "<div class='empty-message'>" + (i18n ? i18n.t("notif.empty") : "새로운 알림이 없습니다.") + "</div>";
          return;
        }

        container.innerHTML = "";
        cachedNotifications.forEach(notification => {
          const item = document.createElement("div");
          item.className = `notification-item ${notification.isRead ? 'read' : 'unread'}`;
          
          const typeText = notification.notificationType === "LIKE"
            ? (i18n ? i18n.t("notif.likeType") : "❤️ 좋아요")
            : (i18n ? i18n.t("notif.commentType") : "💬 댓글");
          const actionText = notification.notificationType === "LIKE"
            ? (i18n ? i18n.t("notif.like") : "좋아요를 눌렀습니다")
            : (i18n ? i18n.t("notif.comment") : "댓글을 남겼습니다");
          const particle = i18n ? i18n.t("notif.actorParticle") : "님이";
          const actorName = notification.actorName || notification.actorEmail;
          const date = new Date(notification.createdAt).toLocaleString(i18n && i18n.getLang() === "ja" ? "ja-JP" : "ko-KR", {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
          
          item.innerHTML = `
            <div class="notification-type">${typeText}</div>
            <div class="notification-action">${actorName}${particle} ${actionText}</div>
            ${notification.postContent ? `<div class="notification-content">${notification.postContent.substring(0, 100)}${notification.postContent.length > 100 ? '...' : ''}</div>` : ""}
            <div class="notification-date">${date}</div>
          `;
          
          // 12-23 알림 클릭 시 읽음 처리 및 게시물 페이지로 이동
          item.onclick = async function(event) {
            event.preventDefault();
            
            // 이미 읽은 알림이면 바로 이동
            if (notification.isRead) {
              window.location.href = `/posts/${notification.postId}`;
              return;
            }
            
            // 12-23 읽지 않은 알림만 읽음 처리
            try {
              const response = await fetch(`/api/notifications/${notification.id}/read`, {
                method: 'POST',
                credentials: 'include'
              });
              
              if (response.ok) {
                console.log('알림 읽음 처리 완료:', notification.id);
                // 12-23 읽음 처리된 알림의 스타일 업데이트
                item.className = 'notification-item read';
                // 알림 목록에서 해당 알림의 isRead 상태 업데이트
                notification.isRead = true;
              } else {
                console.error('알림 읽음 처리 실패:', response.status);
              }
            } catch (error) {
              console.error('알림 읽음 처리 오류:', error);
            }
            
            // 게시물 상세 페이지로 이동
            window.location.href = `/posts/${notification.postId}`;
          };
          
          container.appendChild(item);
        });
      }

      document.addEventListener("sns:langchange", function () {
        if (notificationsLoaded) {
          renderNotifications(cachedNotifications);
        }
      });
    </script>
  </body>
</html>
