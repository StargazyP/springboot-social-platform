<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <script>(function(){try{var t=localStorage.getItem('sns-theme')||'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');var l=localStorage.getItem('sns-lang')||'ko';document.documentElement.setAttribute('lang',l==='ja'?'ja':'ko');}catch(e){}})();</script>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
    <link rel="stylesheet" href="/css/social-theme.css">
    <link rel="stylesheet" href="/css/templates-theme.css">
    <link rel="stylesheet" href="/css/i18n.css">
    <script src="/js/i18n.js" defer></script>
  <script src="/js/social-ui.js" defer></script>
</head>
<body class="theme-body">
  <div class="auth-shell">
    <aside class="auth-brand">
      <div class="auth-brand-logo" aria-hidden="true">S</div>
      <h2>커뮤니티에 참여하세요</h2>
      <p>이름과 이메일만으로 가입하고, 바로 게시물을 작성할 수 있습니다.</p>
    </aside>

    <main class="auth-panel">
      <div class="auth-topbar">
        <label class="theme-switch" title="다크 모드">
          <input type="checkbox" data-theme-toggle aria-label="다크 모드">
          <span class="theme-switch-slider"></span>
          <span>다크</span>
        </label>
      </div>

      <div class="auth-card">
        <h1 data-i18n="auth.createAccount">계정 만들기</h1>
        <form class="auth-form" action="/api/members/signup" method="post">
          <div class="form-field">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="표시 이름" maxlength="50" required autocomplete="name">
          </div>
          <div class="form-field">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-field">
            <label for="password">비밀번호</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" class="form-control" placeholder="4자 이상" minlength="4" maxlength="100" required autocomplete="new-password">
              <button type="button" class="input-toggle" data-password-toggle="password" aria-label="비밀번호 표시">표시</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.signup">가입하기</button>
        </form>

        <div th:if="${error}" class="alert alert-error">
          <p th:text="${error}"></p>
        </div>

        <div class="auth-footer">
          <span data-i18n="auth.hasAccount">이미 계정이 있으신가요?</span> <a href="/login" data-i18n="auth.loginLink">로그인</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
