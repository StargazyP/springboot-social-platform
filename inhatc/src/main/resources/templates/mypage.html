<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <script>(function(){try{var t=localStorage.getItem('sns-theme')||'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');var l=localStorage.getItem('sns-lang')||'ko';document.documentElement.setAttribute('lang',l==='ja'?'ja':'ko');}catch(e){}})();</script>
    <script src="/js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/social-theme.css" />
    <link rel="stylesheet" href="/css/social-pages.css" />
    <link rel="stylesheet" href="/css/templates-theme.css" />
    <link rel="stylesheet" href="/css/i18n.css" />
    <script src="/js/i18n.js" defer></script>
    <script src="/js/social-ui.js" defer></script>
  </head>

  <body class="feed-body page-mypage">
    <div class="wrapper">
      <!-- 메인 컨텐츠 영역 -->
      <div class="main-content">
        <!-- REST/레이아웃 개선: sidebar를 메인 컨테이너 안에 두고 sticky로 따라오게 함 -->
        <div class="sidebar">
          <a href="/main" class="sidebar-item">
            <img src="/images/home.svg" alt="home" />
            <span data-i18n="nav.home">Home</span>
          </a>
          <a href="/member/mypage" class="sidebar-item active">
            <img src="/images/user.svg" alt="User" />
            <span data-i18n="nav.user">User</span>
          </a>
          <a href="/chat/message" class="sidebar-item">
            <img src="/images/message.svg" alt="Message" />
            <span data-i18n="nav.message">Message</span>
          </a>
          <div class="sidebar-item notification-icon-container" onclick="location.href='/posts/notifications/page';" style="cursor: pointer;">
            <img src="/images/bell.svg" alt="Alarm" id="notificationIcon" />
            <span data-i18n="nav.alarm">Alarm</span>
            <span id="notificationBadge" class="notification-badge">0</span>
          </div>
          <div class="sidebar-item" onclick="document.getElementById('logout').submit();" style="cursor: pointer;">
            <img src="/images/logout.svg" alt="Logout" />
            <span data-i18n="nav.logout">Logout</span>
          </div>
          <div class="sidebar-theme">
            <label class="theme-switch" data-i18n-attr="title" data-i18n="nav.themeDark" title="다크 모드">
              <input type="checkbox" data-theme-toggle aria-label="다크 모드">
              <span class="theme-switch-slider"></span>
              <span data-i18n="nav.theme">테마</span>
            </label>
          </div>

          <form id="logout" action="/api/members/logout" method="post"></form>
        </div>

        <div class="mypage-feed-container">
        <div class="mypage-profile">
          <div
            id="profileBanner"
            class="profile-banner"
            th:classappend="${isOwner != null and isOwner == true} ? ' profile-banner-editable' : ''"
            th:attr="data-email=${viewedMember != null ? viewedMember.memberEmail : loggedInMember.memberEmail}"
            data-banner-label="배경 변경"
            data-i18n-attr="data-banner-label"
            data-i18n="mypage.bannerChange"
          ></div>

          <div class="profile-body">
            <div class="profile-top-row">
              <div class="profile-img-wrap">
                <img
                  id="profileImage"
                  class="profile-img"
                  th:classappend="${isOwner != null and isOwner == true} ? ' profile-img-editable' : ''"
                  th:src="@{/member/Userimgsource/{email}(email=${viewedMember != null ? viewedMember.memberEmail : loggedInMember.memberEmail})}"
                  alt="Profile Image"
                  onerror="this.src='/images/default-profile.png'"
                />
                <span th:if="${isOwner != null and isOwner == true}" class="profile-edit-badge" aria-hidden="true">📷</span>
              </div>

              <div th:if="${isOwner == null or !isOwner}" class="profile-actions profile-actions-compact">
                <button
                  id="followButton"
                th:class="${followStats != null && followStats.isFollowing ? 'follow-btn following' : 'follow-btn'}"
                th:attr="data-i18n=${followStats != null && followStats.isFollowing ? 'mypage.followingBtn' : 'mypage.follow'}"
                th:text="${followStats != null && followStats.isFollowing ? '팔로잉' : '팔로우'}"
                  onclick="toggleFollow()"
                >팔로우</button>
                <a
                  class="btn-message"
                  th:href="@{/chat/message(receiverEmail=${viewedMember != null ? viewedMember.memberEmail : loggedInMember.memberEmail})}"
                >
                <img src="/images/message.svg" alt="">
                <span data-i18n="mypage.message">메시지</span>
              </a>
              </div>
            </div>

            <h1 class="profile-name" th:text="${viewedMember != null ? viewedMember.memberName : loggedInMember.memberName}">이름</h1>

            <span
              id="viewedEmailData"
              hidden
              th:attr="data-viewed-email=${viewedMember != null ? viewedMember.memberEmail : loggedInMember.memberEmail}"
            ></span>

            <div class="profile-stats">
              <div onclick="showFollowers()" class="follow-stat">
                <span class="stat-value" th:text="${followStats != null ? followStats.followerCount : 0}">0</span>
                <span class="stat-label" data-i18n="mypage.followers">팔로워</span>
              </div>
              <div onclick="showFollowing()" class="follow-stat">
                <span class="stat-value" th:text="${followStats != null ? followStats.followingCount : 0}">0</span>
                <span class="stat-label" data-i18n="mypage.following">팔로잉</span>
              </div>
            </div>

          </div>
        </div>

        <form
          id="profileUploadForm"
          th:if="${isOwner != null and isOwner == true}"
          th:action="@{/member/upload}"
          method="post"
          enctype="multipart/form-data"
          hidden
        >
          <input type="file" id="profileFileInput" name="file" accept="image/*" />
          <input type="hidden" name="loginEmail" th:value="${loginEmail}" />
        </form>

        <form
          id="bannerUploadForm"
          th:if="${isOwner != null and isOwner == true}"
          th:action="@{/member/upload-banner}"
          method="post"
          enctype="multipart/form-data"
          hidden
        >
          <input type="file" id="bannerFileInput" name="file" accept="image/*" />
          <input type="hidden" name="loginEmail" th:value="${loginEmail}" />
        </form>

        <div id="post-list">
          <div th:if="${userpost != null && !userpost.isEmpty() || userPosts != null && !userPosts.isEmpty()}">
            <article th:each="post : ${userpost != null ? userpost : userPosts}"
                 class="card post-card mypage-post-card"
                 th:attr="data-post-id=${post.id}">
              <div class="mypage-post-header">
                <div class="mypage-post-header-right">
                  <span class="mypage-post-author" th:text="${post.writerName != null ? post.writerName : post.writer}">작성자</span>
                  <div th:if="${isOwner != null and isOwner == true}" class="post-menu">
                    <button type="button" class="post-menu-trigger" data-i18n-attr="aria-label" data-i18n="mypage.postMenu" aria-label="게시물 메뉴" aria-haspopup="true">⋯</button>
                    <div class="post-menu-dropdown" role="menu">
                      <button type="button" class="post-menu-item" data-action="edit" role="menuitem" data-i18n="mypage.edit">수정</button>
                      <button type="button" class="post-menu-item post-menu-item-danger" data-action="delete" role="menuitem" data-i18n="mypage.delete">삭제</button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="mypage-post-body post-card-link">
                <p class="mypage-post-content" th:text="${post.content}">No Content</p>
                <img th:if="${post.imgsource != null && !post.imgsource.isEmpty()}"
                  class="mypage-post-image"
                  th:src="${post.imgsource}"
                  th:alt="${post.writerName != null ? post.writerName + ' 게시물 이미지' : '게시물 이미지'}"
                  onerror="this.style.display='none'"
                />
              </div>
            </article>
          </div>
          <div th:if="${(userpost == null || userpost.isEmpty()) && (userPosts == null || userPosts.isEmpty())}"
               class="empty-message" data-i18n="mypage.emptyPosts">
            작성한 게시글이 없습니다.
          </div>
        </div>
        </div>
      </div>
    </div>

    <!-- 게시물 수정 모달 -->
    <div id="editPostModal" class="modal" style="display: none;">
      <div class="modal-content mypage-edit-modal">
        <div class="mypage-edit-modal-header">
          <h2 data-i18n="mypage.editPost">게시물 수정</h2>
          <button type="button" class="login-modal-close" onclick="closeEditPostModal()" data-i18n-attr="aria-label" data-i18n="common.close" aria-label="닫기">&times;</button>
        </div>
        <textarea id="editPostContent" class="comment-textarea" maxlength="2000" data-i18n-placeholder="mypage.editPlaceholder" placeholder="게시물 내용"></textarea>
        <div class="mypage-edit-modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeEditPostModal()" data-i18n="mypage.cancel">취소</button>
          <button type="button" class="btn btn-primary" onclick="savePostEdit()" data-i18n="mypage.save">저장</button>
        </div>
      </div>
    </div>

    <script>
      let editingPostId = null;

      function closeAllPostMenus() {
        document.querySelectorAll('.post-menu.open').forEach(function(menu) {
          menu.classList.remove('open');
        });
      }

      function openEditPostModal(postId, content) {
        editingPostId = postId;
        document.getElementById('editPostContent').value = content || '';
        document.getElementById('editPostModal').style.display = 'flex';
      }

      function closeEditPostModal() {
        editingPostId = null;
        document.getElementById('editPostModal').style.display = 'none';
        document.getElementById('editPostContent').value = '';
      }

      async function savePostEdit() {
        if (!editingPostId) return;
        const content = document.getElementById('editPostContent').value.trim();
        if (!content) {
          alert('게시물 내용을 입력해주세요.');
          return;
        }

        try {
          const formData = new FormData();
          formData.append('content', content);
          const response = await fetch(`/api/posts/${encodeURIComponent(editingPostId)}`, {
            method: 'PUT',
            body: formData,
            credentials: 'include'
          });
          if (!response.ok) {
            throw new Error('게시물 수정에 실패했습니다.');
          }
          const card = document.querySelector(`.mypage-post-card[data-post-id="${editingPostId}"]`);
          if (card) {
            const contentEl = card.querySelector('.mypage-post-content');
            if (contentEl) contentEl.textContent = content;
          }
          closeEditPostModal();
        } catch (error) {
          console.error(error);
          alert(error.message || '게시물 수정 중 오류가 발생했습니다.');
        }
      }

      function followBtnLabel(isFollowing, hoverUnfollow) {
        if (window.SnsI18n && window.SnsI18n.followLabel) {
          return window.SnsI18n.followLabel(isFollowing, hoverUnfollow);
        }
        if (isFollowing) return hoverUnfollow ? '언팔로우' : '팔로잉';
        return '팔로우';
      }

      document.addEventListener('sns:langchange', function () {
        var followButton = document.getElementById('followButton');
        if (followButton) {
          followButton.textContent = followBtnLabel(followButton.classList.contains('following'), false);
        }
        document.querySelectorAll('.follow-item-btn').forEach(function (btn) {
          btn.textContent = followBtnLabel(btn.classList.contains('following'), false);
        });
      });

      // 게시글 카드 클릭 · 메뉴 이벤트
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.post-card-link').forEach(function(linkArea) {
          linkArea.addEventListener('click', function(e) {
            const card = linkArea.closest('.mypage-post-card');
            if (!card) return;
            const postId = card.getAttribute('data-post-id');
            if (postId) {
              window.location.href = `/posts/${postId}`;
            }
          });
        });

        document.querySelectorAll('.post-menu-trigger').forEach(function(trigger) {
          trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            const menu = trigger.closest('.post-menu');
            const wasOpen = menu.classList.contains('open');
            closeAllPostMenus();
            if (!wasOpen) menu.classList.add('open');
          });
        });

        document.querySelectorAll('.post-menu-item').forEach(function(item) {
          item.addEventListener('click', function(e) {
            e.stopPropagation();
            const card = item.closest('.mypage-post-card');
            const postId = card.getAttribute('data-post-id');
            closeAllPostMenus();

            if (item.dataset.action === 'edit') {
              const text = card.querySelector('.mypage-post-content')?.textContent || '';
              openEditPostModal(postId, text);
            } else if (item.dataset.action === 'delete') {
              deletePostById(postId, card);
            }
          });
        });

        document.addEventListener('click', function() {
          closeAllPostMenus();
        });

        document.getElementById('editPostModal')?.addEventListener('click', function(e) {
          if (e.target === this) closeEditPostModal();
        });

        const profileImage = document.getElementById('profileImage');
        const profileFileInput = document.getElementById('profileFileInput');
        const profileUploadForm = document.getElementById('profileUploadForm');
        const profileBanner = document.getElementById('profileBanner');
        const bannerFileInput = document.getElementById('bannerFileInput');
        const bannerUploadForm = document.getElementById('bannerUploadForm');

        function loadBannerImage() {
          if (!profileBanner) return;
          const email = profileBanner.getAttribute('data-email');
          if (!email) return;
          const img = new Image();
          img.onload = function () {
            profileBanner.style.backgroundImage = "url('/member/Bannersource/" + encodeURIComponent(email) + "?t=" + Date.now() + "')";
            profileBanner.classList.add('has-image');
          };
          img.src = '/member/Bannersource/' + encodeURIComponent(email) + '?t=' + Date.now();
        }

        loadBannerImage();

        if (profileImage && profileImage.classList.contains('profile-img-editable') && profileFileInput && profileUploadForm) {
          profileImage.addEventListener('click', function () {
            profileFileInput.click();
          });
          profileFileInput.addEventListener('change', function () {
            if (profileFileInput.files && profileFileInput.files.length > 0) {
              profileUploadForm.submit();
            }
          });
        }

        if (profileBanner && profileBanner.classList.contains('profile-banner-editable') && bannerFileInput && bannerUploadForm) {
          profileBanner.addEventListener('click', function () {
            bannerFileInput.click();
          });
          bannerFileInput.addEventListener('change', function () {
            if (bannerFileInput.files && bannerFileInput.files.length > 0) {
              bannerUploadForm.submit();
            }
          });
        }
      });
      
      function deletePostById(postId, cardElement) {
        if (!confirm("게시물을 삭제하시겠습니까?")) return;
        fetch(`/api/posts/${encodeURIComponent(postId)}`, {
          method: "DELETE",
          credentials: "include"
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error("게시물 삭제 실패");
            }
            if (cardElement) {
              cardElement.remove();
            }
            const list = document.querySelectorAll('.mypage-post-card');
            if (list.length === 0) {
              const postList = document.getElementById('post-list');
              if (postList && !postList.querySelector('.empty-message')) {
                postList.innerHTML = '<div class="empty-message" data-i18n="mypage.emptyPosts">' +
                  (window.SnsI18n ? window.SnsI18n.t('mypage.emptyPosts') : '작성한 게시글이 없습니다.') +
                  '</div>';
              }
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("게시물 삭제 중 오류가 발생했습니다.");
          });
      }
      // 현재 조회 중인 사용자 이메일 가져오기
      function getViewedEmail() {
        const data = document.getElementById('viewedEmailData');
        if (data) {
          return data.getAttribute('data-viewed-email');
        }
        return null;
      }

      // 팔로우/언팔로우 토글
      async function toggleFollow() {
        const viewedEmail = getViewedEmail();
        if (!viewedEmail) {
          alert('사용자 정보를 찾을 수 없습니다.');
          return;
        }

        const followButton = document.getElementById('followButton');
        const isFollowing = followButton.classList.contains('following');
        const url = `/api/members/me/following/${encodeURIComponent(viewedEmail)}`;

        try {
          const response = await fetch(url, {
            method: isFollowing ? 'DELETE' : 'POST',
            headers: {
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || '팔로우 처리 중 오류가 발생했습니다.');
          }

          // 버튼 상태 업데이트
          if (isFollowing) {
            followButton.classList.remove('following');
            followButton.textContent = followBtnLabel(false, false);
            followButton.setAttribute('data-i18n', 'mypage.follow');
          } else {
            followButton.classList.add('following');
            followButton.textContent = followBtnLabel(true, false);
            followButton.setAttribute('data-i18n', 'mypage.followingBtn');
          }

          // 통계 업데이트
          await updateFollowStats();
        } catch (error) {
          console.error('Error:', error);
          alert(error.message);
        }
      }

      // 팔로우 통계 업데이트
      async function updateFollowStats() {
        const viewedEmail = getViewedEmail();
        if (!viewedEmail) return;

        try {
          const response = await fetch(`/api/members/${encodeURIComponent(viewedEmail)}/follow-stats`);
          if (response.ok) {
            const stats = await response.json();
            // 통계 업데이트 (필요시)
            const followerCountElement = document.querySelector('.follow-stat:first-child span:first-child');
            const followingCountElement = document.querySelector('.follow-stat:last-child span:first-child');
            if (followerCountElement) {
              followerCountElement.textContent = stats.followerCount || 0;
            }
            if (followingCountElement) {
              followingCountElement.textContent = stats.followingCount || 0;
            }
          }
        } catch (error) {
          console.error('Error updating stats:', error);
        }
      }

      // 팔로워 목록 표시
      async function showFollowers() {
        const viewedEmail = getViewedEmail();
        if (!viewedEmail) return;

        try {
          const response = await fetch(`/api/members/${encodeURIComponent(viewedEmail)}/followers`);
          if (!response.ok) {
            throw new Error('팔로워 목록을 불러올 수 없습니다.');
          }

          const followers = await response.json();
          showFollowModal(window.SnsI18n ? window.SnsI18n.t('mypage.followers') : '팔로워', followers, 'follower');
        } catch (error) {
          console.error('Error:', error);
          alert(error.message);
        }
      }

      // 팔로잉 목록 표시
      async function showFollowing() {
        const viewedEmail = getViewedEmail();
        if (!viewedEmail) return;

        try {
          const response = await fetch(`/api/members/${encodeURIComponent(viewedEmail)}/following`);
          if (!response.ok) {
            throw new Error('팔로잉 목록을 불러올 수 없습니다.');
          }

          const following = await response.json();
          showFollowModal(window.SnsI18n ? window.SnsI18n.t('mypage.following') : '팔로잉', following, 'following');
        } catch (error) {
          console.error('Error:', error);
          alert(error.message);
        }
      }

      // 팔로우 모달 표시
      function showFollowModal(title, items, type) {
        // 기존 모달이 있으면 제거
        const existingModal = document.getElementById('followModal');
        if (existingModal) {
          existingModal.remove();
        }

        // 모달 생성
        const modal = document.createElement('div');
        modal.id = 'followModal';
        modal.className = 'modal';
        modal.style.display = 'block';

        const modalContent = document.createElement('div');
        modalContent.className = 'modal-content';

        const modalHeader = document.createElement('div');
        modalHeader.className = 'modal-header';
        modalHeader.innerHTML = `
          <h2>${title}</h2>
          <span class="close" onclick="closeFollowModal()">&times;</span>
        `;

        const modalBody = document.createElement('div');
        modalBody.className = 'modal-body';

        if (items.length === 0) {
          modalBody.innerHTML = '<div style="padding: 40px; text-align: center; color: #536471;">' +
            (window.SnsI18n ? window.SnsI18n.t('mypage.followListEmpty') : '목록이 비어있습니다.') +
            '</div>';
        } else {
          items.forEach(item => {
            const email = type === 'follower' ? item.followerEmail : item.followingEmail;
            const name = type === 'follower' ? item.followerName : item.followingName;
            const profilePath = type === 'follower' ? item.followerProfilePicturePath : item.followingProfilePicturePath;
            const isFollowing = item.isFollowing;

            const followItem = document.createElement('div');
            followItem.className = 'follow-item';
            followItem.onclick = () => {
              window.location.href = `/member/profile/${encodeURIComponent(email)}`;
            };

            followItem.innerHTML = `
              <img 
                src="${profilePath || '/images/default-profile.png'}" 
                alt="${name}" 
                class="follow-item-img"
                onerror="this.src='/images/default-profile.png'"
              />
              <div class="follow-item-info">
                <div class="follow-item-name">${name}</div>
                <div class="follow-item-email">${email}</div>
              </div>
              <button 
                class="follow-item-btn ${isFollowing ? 'following' : 'follow'}"
                onclick="event.stopPropagation(); toggleFollowItem('${email}', this)"
                data-email="${email}"
              >
                ${followBtnLabel(isFollowing, false)}
              </button>
            `;

            modalBody.appendChild(followItem);
          });
        }

        modalContent.appendChild(modalHeader);
        modalContent.appendChild(modalBody);
        modal.appendChild(modalContent);
        document.body.appendChild(modal);

        // 모달 외부 클릭 시 닫기
        modal.onclick = function(event) {
          if (event.target === modal) {
            closeFollowModal();
          }
        };
      }

      // 모달 닫기
      function closeFollowModal() {
        const modal = document.getElementById('followModal');
        if (modal) {
          modal.remove();
        }
      }

      // 팔로우 목록에서 개별 팔로우 토글
      async function toggleFollowItem(email, button) {
        const isFollowing = button.classList.contains('following');
        const url = `/api/members/me/following/${encodeURIComponent(email)}`;

        try {
          const response = await fetch(url, {
            method: isFollowing ? 'DELETE' : 'POST',
            headers: {
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            throw new Error('팔로우 처리 중 오류가 발생했습니다.');
          }

          // 버튼 상태 업데이트
          if (isFollowing) {
            button.classList.remove('following');
            button.classList.add('follow');
            button.textContent = followBtnLabel(false, false);
          } else {
            button.classList.remove('follow');
            button.classList.add('following');
            button.textContent = followBtnLabel(true, false);
          }

          // 통계 업데이트
          await updateFollowStats();
        } catch (error) {
          console.error('Error:', error);
          alert(error.message);
        }
      }
      
    </script>
